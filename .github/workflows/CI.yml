name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run domain tests
        run: npm test

      - name: Build production assets
        run: npm run build
